name: publish
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet pack src/Proto.Dummy.csproj -c Release -o out
      - run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "$TOKEN"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
